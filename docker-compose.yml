version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: urlshortener_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: urlshortner
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: urlshortener_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: backend_4/Dockerfile
    container_name: urlshortener_app
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/urlshortner"
      REDIS_URL: "redis://redis:6379"
      SECRET_KEY: "9fK$2vLx@Q7rN#cT8wP!zH4uY&bJ1sDm"
      ALGORITHAM: "HS256"
    ports:
      - "8000:8000"
    volumes:
      - ./backend_4/qr_codes:/app/qr_codes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
